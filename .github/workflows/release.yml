name: release

# Builds the PTG CLI suite (ptg, ptg-bench, ptg-judge) as native release binaries
# for Linux, macOS (arm64 + x86_64), and Windows whenever a v* tag is pushed,
# smoke-tests each binary actually runs, and attaches the archives to the
# GitHub Release for that tag.
#
# Note on macOS x86_64: it is cross-compiled on the arm64 (macos-latest) runner
# using Apple's universal toolchain, which avoids the long queue / availability
# problems of dedicated Intel (macos-13) runners. Its smoke test is therefore
# skipped (the host cannot execute the foreign arch without Rosetta).

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write # required to create the release and upload assets

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            smoke: true
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
            smoke: true
          # Cross-compiled from the arm64 runner above.
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
            smoke: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            smoke: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build release binaries
        run: cargo build --release --locked --target ${{ matrix.target }} -p ptg-cli

      - name: Smoke test binaries (unix)
        if: matrix.smoke && matrix.archive != 'zip'
        run: |
          set -e
          bindir="target/${{ matrix.target }}/release"
          echo "::group::ptg --version"
          "$bindir/ptg" --version
          echo "::endgroup::"
          echo "::group::ptg-bench --help"
          "$bindir/ptg-bench" --help | head -n 1
          echo "::endgroup::"
          echo "::group::ptg-judge --help"
          "$bindir/ptg-judge" --help | head -n 1
          echo "::endgroup::"

      - name: Smoke test binaries (windows)
        if: matrix.smoke && matrix.archive == 'zip'
        shell: pwsh
        run: |
          $bindir = "target/${{ matrix.target }}/release"
          & "$bindir/ptg.exe" --version
          (& "$bindir/ptg-bench.exe" --help | Select-Object -First 1)
          (& "$bindir/ptg-judge.exe" --help | Select-Object -First 1)

      - name: Stage package (unix)
        if: matrix.archive != 'zip'
        run: |
          set -e
          staging="ptg-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p "$staging/bin"
          cp "target/${{ matrix.target }}/release/ptg" \
             "target/${{ matrix.target }}/release/ptg-bench" \
             "target/${{ matrix.target }}/release/ptg-judge" \
             "$staging/bin/"
          cp README.md LICENSE-MIT LICENSE-APACHE "$staging/" 2>/dev/null || true
          tar czf "$staging.tar.gz" "$staging"
          echo "ASSET=$staging.tar.gz" >> "$GITHUB_ENV"

      - name: Stage package (windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $staging = "ptg-${{ github.ref_name }}-${{ matrix.target }}"
          $bindir = "target/${{ matrix.target }}/release"
          New-Item -ItemType Directory -Force -Path "$staging/bin" | Out-Null
          Copy-Item -Path "$bindir/ptg.exe","$bindir/ptg-bench.exe","$bindir/ptg-judge.exe" -Destination "$staging/bin/"
          Copy-Item -Path README.md,LICENSE-MIT,LICENSE-APACHE -Destination "$staging/" -ErrorAction SilentlyContinue
          Compress-Archive -Path "$staging" -DestinationPath "$staging.zip"
          "ASSET=$staging.zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload asset to the release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET }}
          fail_on_unmatched_files: true
