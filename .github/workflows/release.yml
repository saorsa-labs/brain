name: release

# Builds the PTG CLI suite (ptg, ptg-bench, ptg-judge) as native release binaries
# for Linux, macOS (arm64 + x86_64), and Windows whenever a v* tag is pushed,
# smoke-tests each binary actually runs, and attaches the archives to the
# GitHub Release for that tag.
#
# Note on macOS x86_64: it is cross-compiled on the arm64 (macos-latest) runner
# using Apple's universal toolchain, which avoids the long queue / availability
# problems of dedicated Intel (macos-13) runners. Its smoke test is therefore
# skipped (the host cannot execute the foreign arch without Rosetta).

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write # required to create the release and upload assets

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            smoke: true
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
            smoke: true
          # Cross-compiled from the arm64 runner above.
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
            smoke: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            smoke: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build release binaries
        run: cargo build --release --locked --target ${{ matrix.target }} -p ptg-cli

      - name: Smoke test binaries (unix)
        if: matrix.smoke && matrix.archive != 'zip'
        run: |
          set -e
          bindir="target/${{ matrix.target }}/release"
          echo "::group::ptg --version"
          "$bindir/ptg" --version
          echo "::endgroup::"
          echo "::group::ptg-bench --help"
          "$bindir/ptg-bench" --help | head -n 1
          echo "::endgroup::"
          echo "::group::ptg-judge --help"
          "$bindir/ptg-judge" --help | head -n 1
          echo "::endgroup::"
          echo "::group::ptg setup --dry-run (setup phase runs on this platform)"
          "$bindir/ptg" setup --dry-run --gguf-dir /tmp/ptg-smoke-gguf
          echo "::endgroup::"

      - name: Smoke test binaries (windows)
        if: matrix.smoke && matrix.archive == 'zip'
        shell: pwsh
        run: |
          $bindir = "target/${{ matrix.target }}/release"
          & "$bindir/ptg.exe" --version
          (& "$bindir/ptg-bench.exe" --help | Select-Object -First 1)
          (& "$bindir/ptg-judge.exe" --help | Select-Object -First 1)
          # The setup phase must run on Windows too (no network in --dry-run).
          & "$bindir/ptg.exe" setup --dry-run --gguf-dir "$env:TEMP\ptg-smoke-gguf"

      # ---- macOS Code Signing & Notarization (mirrors x0x release.yml) ----
      # Requires the org-level secrets MACOS_CERTIFICATE / MACOS_CERTIFICATE_PASSWORD
      # / KEYCHAIN_PASSWORD / MACOS_SIGNING_IDENTITY (+ notarization triple) to be
      # scoped to this repo. If the secret is empty the import step fails loudly so
      # we never silently ship an unsigned binary labelled as signed.
      - name: Import macOS signing certificate
        if: contains(matrix.target, 'apple-darwin')
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERTIFICATE" ]; then
            echo "::error::MACOS_CERTIFICATE secret is empty/missing for this repo. "
            echo "::error::Scope the saorsa-labs org Apple-signing secrets to this repo, "
            echo "::error::or drop this step. Refusing to ship an unsigned macOS binary."
            exit 1
          fi
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          echo "$MACOS_CERTIFICATE" | base64 --decode -o "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: Sign macOS binaries
        if: contains(matrix.target, 'apple-darwin')
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          for bin in ptg ptg-bench ptg-judge; do
            BINARY="target/${{ matrix.target }}/release/${bin}"
            if [ -f "$BINARY" ]; then
              codesign --force --options runtime --sign "$MACOS_SIGNING_IDENTITY" --timestamp "$BINARY"
              codesign --verify --deep --strict "$BINARY"
              echo "Signed ${bin} successfully"
            fi
          done

      # Notarization contacts Apple and validates the Developer Program License
      # Agreement; an expired/unsigned agreement returns HTTP 403 and is an
      # account-level blocker, not a build defect. Binaries are still codesigned
      # (the Sign step above uses an offline cert), so an un-notarized macOS
      # binary is usable with a Gatekeeper prompt. Kept non-blocking so a lapsed
      # agreement cannot hold back Linux/Windows; re-run after re-signing to
      # ship notarized macOS. (Mirrors x0x release.yml.)
      - name: Notarize macOS binaries
        if: contains(matrix.target, 'apple-darwin')
        continue-on-error: true
        env:
          MACOS_NOTARIZATION_APPLE_ID: ${{ secrets.MACOS_NOTARIZATION_APPLE_ID }}
          MACOS_NOTARIZATION_PASSWORD: ${{ secrets.MACOS_NOTARIZATION_PASSWORD }}
          MACOS_NOTARIZATION_TEAM_ID: ${{ secrets.MACOS_NOTARIZATION_TEAM_ID }}
        run: |
          for bin in ptg ptg-bench ptg-judge; do
            BINARY="target/${{ matrix.target }}/release/${bin}"
            if [ -f "$BINARY" ]; then
              ditto -c -k --keepParent "$BINARY" "$RUNNER_TEMP/notarize-${bin}.zip"
              if xcrun notarytool submit "$RUNNER_TEMP/notarize-${bin}.zip" \
                --apple-id "$MACOS_NOTARIZATION_APPLE_ID" \
                --password "$MACOS_NOTARIZATION_PASSWORD" \
                --team-id "$MACOS_NOTARIZATION_TEAM_ID" \
                --wait; then
                echo "Notarized ${bin} successfully"
              else
                echo "::warning::Notarization failed for ${bin} (likely an expired Apple Developer agreement); shipping signed-but-un-notarized binary."
              fi
            fi
          done

      - name: Clean up macOS keychain
        if: contains(matrix.target, 'apple-darwin') && always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db 2>/dev/null || true

      - name: Stage package (unix)
        if: matrix.archive != 'zip'
        run: |
          set -e
          staging="ptg-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p "$staging/bin"
          cp "target/${{ matrix.target }}/release/ptg" \
             "target/${{ matrix.target }}/release/ptg-bench" \
             "target/${{ matrix.target }}/release/ptg-judge" \
             "$staging/bin/"
          cp README.md LICENSE-MIT LICENSE-APACHE "$staging/" 2>/dev/null || true
          tar czf "$staging.tar.gz" "$staging"
          echo "ASSET=$staging.tar.gz" >> "$GITHUB_ENV"

      - name: Stage package (windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $staging = "ptg-${{ github.ref_name }}-${{ matrix.target }}"
          $bindir = "target/${{ matrix.target }}/release"
          New-Item -ItemType Directory -Force -Path "$staging/bin" | Out-Null
          Copy-Item -Path "$bindir/ptg.exe","$bindir/ptg-bench.exe","$bindir/ptg-judge.exe" -Destination "$staging/bin/"
          Copy-Item -Path README.md,LICENSE-MIT,LICENSE-APACHE -Destination "$staging/" -ErrorAction SilentlyContinue
          Compress-Archive -Path "$staging" -DestinationPath "$staging.zip"
          "ASSET=$staging.zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload asset to the release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET }}
          fail_on_unmatched_files: true
