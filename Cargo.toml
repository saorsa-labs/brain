[workspace]
resolver = "2"
members = [
    "crates/ptg-core",
    "crates/ptg-vllm",
    "crates/ptg-consensus",
    "crates/ptg-runtime",
    "crates/ptg-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["Saorsa Labs <david@saorsalabs.com>"]
repository = "https://github.com/saorsa-labs/brain"
homepage = "https://github.com/saorsa-labs/brain"
description = "Project Thousand-Gemma: a distributed, prompt-based cortical mesh simulator in Rust."

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "http2", "rustls-tls"] }
futures = "0.3"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
ndarray = "0.16"

[profile.release]
lto = true
codegen-units = 1
